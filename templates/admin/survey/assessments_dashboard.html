{% extends "admin/base_site.html" %}
{% block content %}
  <div class="content">
    <h1>{{ title }}</h1>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;max-width:1100px;">
      {% for c in cards %}
        <div class="module" style="padding:16px;border-radius:12px;">
          <h2 style="margin-top:0;">{{ c.title }}</h2>
          <p style="color:#444;">{{ c.desc }}</p>
          <ul>
            {% for t, u in c.links %}
              <li>
                {% if u == "#" %}
                  <span style="color:#888;">{{ t }}</span>
                {% else %}
                  <a href="{{ u }}">{{ t }}</a>
                {% endif %}
              </li>
            {% endfor %}
          </ul>
        </div>
      {% endfor %}
    </div>
  </div>
{% endblock %}
